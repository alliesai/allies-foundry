name: Verify Staging HTTPS

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public HTTPS base URL for the staging service"
        required: false
        type: string

permissions: {}

concurrency:
  group: staging-https-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public HTTPS healthcheck
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: ${{ inputs.base_url || vars.STAGING_URL }}
    steps:
      - name: Check public HTTPS readiness
        shell: bash
        run: |
          set -euo pipefail

          base_url="${BASE_URL%/}"
          [[ "$base_url" =~ ^https://[^/[:space:]]+$ ]] || {
            echo "BASE_URL must be an https:// base URL without a path" >&2
            exit 1
          }

          echo "::add-mask::${base_url}"
          health_url="${base_url}/healthz"
          echo "::add-mask::${health_url}"
          http_base="${base_url#https://}"
          http_url="http://${http_base}/healthz"
          echo "::add-mask::${http_url}"
          redirect=$(curl --silent --max-time 10 --max-redirs 0 \
            --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            "$http_url" || true)
          [[ "$redirect" =~ ^(301|302|307|308)[[:space:]]https:// ]] || {
            echo "Plain HTTP /healthz did not redirect to HTTPS" >&2
            exit 1
          }

          for attempt in $(seq 1 30); do
            status=$(curl --silent --max-time 10 \
              --output response.json --write-out '%{http_code}' \
              "$health_url" || true)
            if [[ "$status" == "200" ]] && jq -e '.status == "ok"' response.json >/dev/null 2>&1; then
              echo "Public HTTPS readiness passed on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/30 returned HTTP ${status:-request-error}; retrying..."
            sleep 10
          done

          echo "Public HTTPS readiness failed after 30 attempts." >&2
          exit 1
